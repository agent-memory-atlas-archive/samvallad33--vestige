[package]
name = "vestige-e2e-tests"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# The e2e harness drives the legacy SQLite store end to end. Off by default
# so `cargo test --workspace` does not enable `legacy-sqlite` through this
# crate (feature unification). Opt in with `--features legacy-sqlite`.
# `v3-engine` is part of that opt-in so the harness can create synthetic
# stores; it is not a default feature (build/t5-legacy-isolation).
# Same opt-in as draft #328.
default = []
legacy-sqlite = [
    "vestige-core/legacy-sqlite",
    "vestige-core/bundled-sqlite",
    "vestige-core/v3-engine",
]

[dependencies]
vestige-core = { path = "../../crates/vestige-core", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[test]]
name = "cognitive_tests"
required-features = ["legacy-sqlite"]
path = "tests/cognitive/mod.rs"

