[package]
name = "vestige-phase-1-tests"
version = "0.0.1"
edition = "2024"
publish = false

[features]
# Phase-1 tests round-trip through the legacy SQLite store; the raw
# domain-column migration test reads the SQLite file directly. Off by
# default so a workspace build does not unify rusqlite into the 4.0
# binaries. Opt in with `--features legacy-sqlite`.
default = []
legacy-sqlite = [
    "vestige-core/legacy-sqlite",
    "vestige-core/bundled-sqlite",
    "vestige-core/v3-engine",
    "dep:rusqlite",
]

[dependencies]
vestige-core = { path = "../../crates/vestige-core", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[[test]]
name = "trait_round_trip"
required-features = ["legacy-sqlite"]
path = "trait_round_trip.rs"

[[test]]
name = "domain_column_migration"
required-features = ["legacy-sqlite"]
path = "domain_column_migration.rs"

[[test]]
name = "cognitive_module_isolation"
required-features = ["legacy-sqlite"]
path = "cognitive_module_isolation.rs"

[[test]]
name = "send_bound_variant"
required-features = ["legacy-sqlite"]
path = "send_bound_variant.rs"

