[package]
name = "strata-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "STRATA-native memory store: StrataLog as the append-only source of truth, gate-admitted writes, kernel-folded FSRS"
publish = false

# Standalone on purpose: this crate keeps its own (empty) workspace table so
# it does NOT join the vestige root workspace while the sibling strata crates
# are being integrated by parallel agents. Re-parent deliberately, never
# implicitly.
[workspace]

[dependencies]
strata = { path = "../strata" }
strata-kernel = { path = "../strata-kernel" }
strata-gate = { path = "../strata-gate" }
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
