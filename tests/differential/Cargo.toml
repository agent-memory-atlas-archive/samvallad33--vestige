[package]
name = "vestige-differential-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cross-engine differential harness: replays seeded operation scripts against vestige-core SQLite Storage AND strata (kernel + gate directly), asserting parity and per-engine byte-identical reruns. Gates the SQLite->STRATA default flip."

[features]
# The harness replays scripts through legacy SQLite Storage. Off by default
# so a workspace build does not unify rusqlite into the 4.0 binaries.
# Opt in with `--features legacy-sqlite`. Same opt-in as draft #328.
default = []
legacy-sqlite = [
    "vestige-core/legacy-sqlite",
    "vestige-core/bundled-sqlite",
    "vestige-core/v3-engine",
]

[dependencies]
vestige-core = { path = "../../crates/vestige-core", default-features = false }
strata-kernel = { path = "../../crates/strata-kernel" }
strata-gate = { path = "../../crates/strata-gate" }
strata-verify = { path = "../../crates/strata-verify" }
borsh = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tempfile = "3"

[[bin]]
name = "differential"
path = "src/bin/differential.rs"
required-features = ["legacy-sqlite"]

[[test]]
name = "differential"
path = "tests/differential.rs"
required-features = ["legacy-sqlite"]
